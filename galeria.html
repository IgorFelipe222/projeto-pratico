<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Galeria do Vasco da Gama</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ffffff;
      font-family: Georgia, serif;
      border-bottom: 3px solid #d10000;
      padding-bottom: 10px;
    }

    
    .galeria {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 30px auto;
    }

    figure {
      background-color: #1a1a1a;
      border: 3px solid #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin: 0;
      text-align: center;
    }

    img, video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
    }

    audio {
      width: 100%;
      margin-top: 60px;
      margin-bottom: 60px;
    }

    figcaption {
      margin-top: 10px;
      font-size: 16px;
      font-style: italic;
      color: #ffffff;
    }

    h2 {
      grid-column: 1 / 4;
      color: #ff2a2a;
      font-family: Georgia, serif;
      margin-bottom: 0;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>

  <h1>Galeria do Vasco da Gama</h1>

  <div class="galeria">

    <!-- IMAGENS -->
    <h2>Imagens</h2>

    <figure>
      <img src="img2.jpg" alt="Estadio de Sao Januario" height="400">
      <figcaption>Vista aerea de Sao Januario, a casa do Vasco</figcaption>
    </figure>

    <figure>
      <img src="img1.jpg" alt="Estadio de Sao Januario visto de fora" height="400">
      <figcaption>Sao Januario visto de fora</figcaption>
    </figure>

    <figure>
      <img src="img3.jpg" alt="Sao Januario em 2020" height="400">
      <figcaption>Sao Januario em 2020</figcaption>
    </figure>

    <!-- VIDEOS -->
    <h2>Videos</h2>

    <figure>
      <video controls>
        <source src="videoplayback.mp4" type="video/mp4">
        Seu navegador nao suporta video.
      </video>
      <figcaption>Gols do titulo da Libertadores 1998</figcaption>
    </figure>

    <figure>
      <video controls>
        <source src="videoplayback (1).mp4" type="video/mp4">
        Seu navegador nao suporta video.
      </video>
      <figcaption>Gols do titulo do Brasileirao 1997</figcaption>
    </figure>

    <figure>
      <video controls>
        <source src="videoplayback (2).mp4" type="video/mp4">
        Seu navegador nao suporta video.
      </video>
      <figcaption>Gols do titulo da Copa do Brasil 2011</figcaption>
    </figure>

    <!-- AUDIOS -->
    <h2>Audios</h2>

    <figure>
      <audio controls>
        <source src="Hino do Vasco da Gama (Letra)   Himno de Vasco da Gama (Letra).mp3" type="audio/mp3">
        Seu navegador nao suporta audio.
      </audio>
      <figcaption>Hino do Vasco</figcaption>
    </figure>

    <figure>
      <audio controls>
        <source src="HIno do Vasco - Versao Baroes da Pisadinha.mp3" type="audio/mp3">
        Seu navegador nao suporta audio.
      </audio>
      <figcaption>Hino do vasco versão barrões da pisadinha</figcaption>
    </figure>

    <figure>
      <audio controls>
        <source src="Caju e Castanha Vasco x Flamengo.mp3" type="audio/mp3">
        Seu navegador nao suporta audio.
      </audio>
      <figcaption>Vasco x Flamengo</figcaption>
    </figure>

  </div>

  <footer>
    <p>Feito por Igor - trabalho de HTML e CSS</p>
  <footer>

</body>
</html>
